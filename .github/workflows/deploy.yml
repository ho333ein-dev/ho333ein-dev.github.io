name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages.
# Runs on every push to main, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish; id-token is required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # enablement:true turns GitHub Pages on for the repo on the first run,
      # so no manual trip to Settings -> Pages is required.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `npm ci` is strict and gives the fastest, most reproducible install.
      # The fallback only fires if the lockfile and package.json ever drift
      # apart, so a stale lock cannot block a deploy.
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # base_path is "/<repo>"; the trailing slash matters so that asset URLs
      # become /<repo>/assets/... and resolve under the project sub-path.
      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
